<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartOne ERP Demo</title>
  <link rel="stylesheet" href="assets/vendor/prototype-kit.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="erp-app" id="erpApp">
    <div class="topbar">
      <div class="topbar-left">
        <div class="logo-wrapper">
          <div class="logo-box">SmartOne</div>
        </div>
        <button class="menu-trigger" id="menuTrigger" type="button" aria-label="切换菜单" title="切换菜单"><span></span></button>
        <div class="menu-search" id="menuSearch">
          <div class="search-box" id="menuSearchControl" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-owns="menuSearchPanel">
            <input class="menu-search-input" id="menuSearchInput" type="search" placeholder="请输入搜索内容" autocomplete="off" aria-label="搜索应用菜单" aria-controls="menuSearchResults" aria-autocomplete="list">
            <button class="menu-search-clear" id="menuSearchClear" type="button" aria-label="清空搜索" title="清空搜索" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
            </button>
          </div>
          <div class="menu-search-panel" id="menuSearchPanel" role="listbox" aria-label="菜单搜索结果" hidden>
            <div class="menu-search-summary">
              <span class="menu-search-summary-left">
                <svg class="menu-search-summary-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
                <span id="menuSearchSummaryText"></span>
              </span>
              <span class="menu-search-total">共 <strong id="menuSearchTotal">0</strong> 项</span>
            </div>
            <div class="menu-search-results" id="menuSearchResults"></div>
            <div class="menu-search-empty" id="menuSearchEmpty" hidden>未找到匹配菜单</div>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="top-icon" title="工作台">⌂</span>
        <span class="top-icon" title="通知">🔔<span class="notify-badge">65</span></span>
        <a class="top-icon help-link" href="https://itsm.sipingsoft.com" target="_blank" rel="noreferrer" title="帮助">?</a>
        <span class="top-icon" title="语言">🌐</span>
        <span class="top-icon" title="锁屏">🔒</span>
        <span class="top-icon" title="全屏">⛶</span>
        <span class="avatar-box">
          <span class="avatar-circle"></span>
          <span class="user-name">Admin</span>
          <span class="arrow-down">▾</span>
        </span>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="menu-group" id="sidebarMenu"></div>
        <div class="sidebar-version">Version 3.2.4.240903</div>
      </aside>

      <div class="third-menu-panel hidden" id="thirdMenuPanel">
        <button class="third-menu-mask" id="thirdMenuMask" type="button" tabindex="-1" aria-label="关闭菜单"></button>
        <div class="third-menu-shell">
          <div class="content-middle">
            <div class="menu-group-wrap" id="thirdMenuContent"></div>
          </div>
          <div class="content-right">
            <div class="anchor-point-wrap">
              <div class="kd-anchor-wrapper">
                <div class="kd-anchor">
                  <div class="kd-anchor-line"><span class="kd-anchor-line-slider" id="anchorSlider"></span></div>
                  <div id="thirdMenuAnchor"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <main class="content">
        <nav class="workspace-tabs" id="workspaceTabs" aria-label="已打开页面">
          <div class="workspace-tabs-nav" id="workspaceTabsNav" role="tablist">
            <span class="workspace-tabs-active-bar" id="workspaceTabsActiveBar" aria-hidden="true"></span>
          </div>
        </nav>
        <section class="page-stage">
          <div class="empty-view" id="emptyView">
            <div class="empty-icon" aria-hidden="true"></div>
            <h1>页面待接入</h1>
            <p id="emptyDescription"></p>
          </div>
          <iframe class="page-frame" id="pageFrame" title="ERP 原型页面" hidden></iframe>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/vendor/prototype-kit.js"></script>
  <script src="assets/js/menu-data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
